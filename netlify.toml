[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/login"
  status = 200
  force = true

[[redirects]]
  from = "/session"
  to = "/.netlify/functions/session"
  status = 200
  force = true

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/logout"
  status = 200
  force = true

[[redirects]]
  from = "/panel/exercises"
  to = "/.netlify/functions/exercises"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 200
  force = true

